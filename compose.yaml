services:
  uptime-kuma:
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    image: uptime-kuma-traceroute:latest
    restart: unless-stopped
    environment:
      # true = keep existing database/data, false = erase all data and create a new database.
      - UPTIME_KUMA_USE_EXISTING_DB=true
    volumes:
      # Persistent Docker volume: survives image rebuilds, container recreation and Dokploy redeploys.
      - uptime-kuma-data:/app/data
      # Legacy bind mount used only for the first migration from the previous ./data setup.
      - ./data:/legacy-data:ro
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"

volumes:
  uptime-kuma-data:
    name: uptime-kuma-data
